<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <linearGradient id="ecoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: ui-monospace, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Fundo -->
  <rect width="900" height="380" rx="14" fill="url(#ecoBg)" />
  <rect width="898" height="378" x="1" y="1" rx="13" fill="none" stroke="#1f2937" stroke-width="1.5" />

  <!-- Cabecalho -->
  <g transform="translate(40, 40)">
    <rect width="180" height="28" rx="6" fill="#1e293b" />
    <text x="90" y="18" text-anchor="middle" fill="#10b981" font-size="11" class="font-mono" font-weight="700">ARQUITETURA LOCAL-FIRST</text>

    <text x="200" y="20" fill="#f8fafc" font-size="20" class="font-sans" font-weight="800">
      Ecossistema Conexão Móvel — Sem Nuvem e Sem Contas
    </text>
    <text x="0" y="46" fill="#94a3b8" font-size="13" class="font-sans">
      Comunicação direta ponto a ponto criptografada com velocidade nativa em sua própria rede local (Wi-Fi ou Ethernet).
    </text>
  </g>

  <!-- Diagrama Central -->
  <g transform="translate(40, 115)">
    <!-- No Esquerdo: Smartphone Android -->
    <g transform="translate(0, 0)">
      <rect width="240" height="210" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <rect width="216" height="40" x="12" y="12" rx="8" fill="#1e293b" />
      <circle cx="32" cy="32" r="5" fill="#38bdf8" />
      <text x="46" y="36" fill="#f8fafc" font-size="13" class="font-sans" font-weight="700">Smartphone Android</text>

      <text x="20" y="76" fill="#94a3b8" font-size="11" class="font-mono">STACK TECNOLÓGICA:</text>
      <text x="20" y="96" fill="#e2e8f0" font-size="12" class="font-sans">• Kotlin &amp; Jetpack Compose</text>
      <text x="20" y="118" fill="#e2e8f0" font-size="12" class="font-sans">• Rust Core via JNI / FFI</text>
      <text x="20" y="140" fill="#e2e8f0" font-size="12" class="font-sans">• AudioTrack PCM de Baixa Latência</text>
      <text x="20" y="162" fill="#e2e8f0" font-size="12" class="font-sans">• Auto-Update OTA em Segundo Plano</text>
      <text x="20" y="190" fill="#38bdf8" font-size="11" class="font-mono">STATUS: ATIVO (ARM64 / x86_64)</text>
    </g>

    <!-- Centro: Canal Criptografado P2P -->
    <g transform="translate(260, 20)">
      <!-- Linhas de Conexao -->
      <line x1="0" y1="85" x2="300" y2="85" stroke="url(#lineGrad)" stroke-width="3" stroke-dasharray="8 6" />
      
      <!-- Caixa do Protocolo -->
      <g transform="translate(40, 30)">
        <rect width="220" height="110" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
        <text x="110" y="28" text-anchor="middle" fill="#34d399" font-size="12" class="font-mono" font-weight="700">CANAL P2P LOCAL</text>
        <text x="110" y="50" text-anchor="middle" fill="#f8fafc" font-size="12" class="font-sans" font-weight="600">TLS 1.3 / ChaCha20-Poly1305</text>
        <text x="110" y="70" text-anchor="middle" fill="#94a3b8" font-size="11" class="font-mono">Latência Sub-Milissegundo</text>
        <text x="110" y="90" text-anchor="middle" fill="#38bdf8" font-size="10" class="font-mono">Zero Servidores na Nuvem</text>
      </g>
    </g>

    <!-- No Direito: Computador (Windows & Linux) -->
    <g transform="translate(580, 0)">
      <rect width="240" height="210" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <rect width="216" height="40" x="12" y="12" rx="8" fill="#1e293b" />
      <circle cx="32" cy="32" r="5" fill="#10b981" />
      <text x="46" y="36" fill="#f8fafc" font-size="13" class="font-sans" font-weight="700">Computador (PC)</text>

      <text x="20" y="76" fill="#94a3b8" font-size="11" class="font-mono">STACK TECNOLÓGICA:</text>
      <text x="20" y="96" fill="#e2e8f0" font-size="12" class="font-sans">• Rust Assíncrono (tokio / zbus)</text>
      <text x="20" y="118" fill="#e2e8f0" font-size="12" class="font-sans">• Qt / QML com Renderização GPU</text>
      <text x="20" y="140" fill="#e2e8f0" font-size="12" class="font-sans">• PipeWire / WASAPI Loopback</text>
      <text x="20" y="162" fill="#e2e8f0" font-size="12" class="font-sans">• Wake-on-LAN &amp; Gerenciador D-Bus</text>
      <text x="20" y="190" fill="#10b981" font-size="11" class="font-mono">STATUS: ATIVO (WINDOWS &amp; LINUX)</text>
    </g>
  </g>
</svg>
