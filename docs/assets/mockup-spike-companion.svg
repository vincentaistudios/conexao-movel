<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="spikeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f87171" />
    </linearGradient>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b1" />
      <feMerge><feMergeNode in="b1" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b2" />
      <feMerge><feMergeNode in="b2" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: ui-monospace, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Fundo com Borda Estilizada -->
  <rect width="900" height="520" rx="14" fill="url(#spikeBg)" />
  <rect width="898" height="518" x="1" y="1" rx="13" fill="none" stroke="#1f2937" stroke-width="1.5" />

  <!-- Cabecalho do HUD -->
  <g transform="translate(40, 45)">
    <rect width="180" height="28" rx="6" fill="#1e293b" />
    <text x="90" y="18" text-anchor="middle" fill="#38bdf8" font-size="11" class="font-mono" font-weight="700">VALORANT HUD TÁTICO</text>

    <text x="200" y="20" fill="#f8fafc" font-size="20" class="font-sans" font-weight="800">
      Spike Companion — Cronômetro e Auxiliar de Defuse
    </text>
    <text x="0" y="48" fill="#94a3b8" font-size="13" class="font-sans">
      Compensação de latência de rede local, zonas críticas coloridas e simulação tática com resposta háptica.
    </text>
  </g>

  <!-- Painel Esquerdo: Cronometro Circular e Botoes -->
  <g transform="translate(60, 130)">
    <!-- Moldura de Vidro Fosco do Timer -->
    <rect width="320" height="340" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

    <!-- Circulo do Cronometro -->
    <circle cx="160" cy="140" r="95" fill="none" stroke="#1e293b" stroke-width="12" />
    <!-- Arco de Progresso (Simulado em 40s) -->
    <circle cx="160" cy="140" r="95" fill="none" stroke="url(#crimsonGrad)" stroke-width="12" stroke-dasharray="450 150" stroke-linecap="round" filter="url(#glowRed)" />

    <!-- Tempo Digital Central -->
    <text x="160" y="132" text-anchor="middle" fill="#f8fafc" font-size="44" class="font-mono" font-weight="900">40.00s</text>
    <text x="160" y="160" text-anchor="middle" fill="#ef4444" font-size="12" class="font-mono" font-weight="700">SPIKE ATIVA (PLANTADA)</text>
    <text x="160" y="178" text-anchor="middle" fill="#94a3b8" font-size="11" class="font-sans">Atraso de Rede: 0ms compensado</text>

    <!-- Botoes de Acao do HUD -->
    <g transform="translate(25, 260)">
      <rect width="130" height="48" rx="10" fill="#dc2626" />
      <text x="65" y="29" text-anchor="middle" fill="#ffffff" font-size="13" class="font-sans" font-weight="700">PLANTAR (0s)</text>
    </g>

    <g transform="translate(165, 260)">
      <rect width="130" height="48" rx="10" fill="#0284c7" />
      <text x="65" y="29" text-anchor="middle" fill="#ffffff" font-size="13" class="font-sans" font-weight="700">DEFUSAR (7s)</text>
    </g>
  </g>

  <!-- Painel Direito: Matriz de Cores e Decisao Tatica -->
  <g transform="translate(420, 130)">
    <!-- Cartao 1: Verde (Defuse Total) -->
    <g transform="translate(0, 0)">
      <rect width="420" height="96" rx="12" fill="#062e24" stroke="#059669" stroke-width="1.5" />
      <circle cx="36" cy="48" r="14" fill="url(#emeraldGrad)" filter="url(#glowGreen)" />
      <path d="M 30 48 L 34 52 L 42 44" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="66" y="34" fill="#34d399" font-size="15" class="font-sans" font-weight="700">ZONA SEGURA: DEFUSE TOTAL (&gt; 7.0s)</text>
      <text x="66" y="55" fill="#a7f3d0" font-size="12" class="font-sans">Janela completa aberta para desarme de 7 segundos.</text>
      <text x="66" y="74" fill="#6ee7b7" font-size="11" class="font-mono">Tom de audio normal (1000 Hz) • Desarme 100% viavel</text>
    </g>

    <!-- Cartao 2: Amarelo (Half Defuse Limite) -->
    <g transform="translate(0, 115)">
      <rect width="420" height="96" rx="12" fill="#2d2006" stroke="#d97706" stroke-width="1.5" />
      <circle cx="36" cy="48" r="14" fill="url(#amberGrad)" />
      <path d="M 36 38 L 36 50 M 36 56 L 36 58" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <text x="66" y="34" fill="#fbbf24" font-size="15" class="font-sans" font-weight="700">NO LIMITE: APENAS HALF DEFUSE (3.5s - 7.0s)</text>
      <text x="66" y="55" fill="#fde68a" font-size="12" class="font-sans">Tempo insuficiente para desarme completo. Garanta o ponto médio.</text>
      <text x="66" y="74" fill="#fcd34d" font-size="11" class="font-mono">Pitch shift agudo (1600 Hz) aos 3.5s • Salve a metade</text>
    </g>

    <!-- Cartao 3: Vermelho (Zona Critica / Corra) -->
    <g transform="translate(0, 230)">
      <rect width="420" height="96" rx="12" fill="#350b0b" stroke="#dc2626" stroke-width="1.5" />
      <circle cx="36" cy="48" r="14" fill="url(#crimsonGrad)" filter="url(#glowRed)" />
      <path d="M 30 42 L 42 54 M 42 42 L 30 54" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <text x="66" y="34" fill="#f87171" font-size="15" class="font-sans" font-weight="700">ZONA CRÍTICA: NÃO DÁ MAIS (&lt; 3.5s)</text>
      <text x="66" y="55" fill="#fecaca" font-size="12" class="font-sans">Desarme fisicamente impossível mesmo se já estiver na metade.</text>
      <text x="66" y="74" fill="#fca5a5" font-size="11" class="font-mono">CORRA DA EXPLOSÃO • SALVE O ARMAMENTO (SAVE WEAPON)</text>
    </g>
  </g>
</svg>
