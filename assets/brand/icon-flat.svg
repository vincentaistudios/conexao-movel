<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Obsidian / Sapphire Gradient Background -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Electric Accent Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Chrome & Silver Gradients for the V Logo Wings -->
    <linearGradient id="vLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="vRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <linearGradient id="vCenterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle (flat, sem glow radial) -->
  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#tileBg)"/>
  <rect x="28" y="28" width="456" height="456" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Monograma V -->
  <g transform="translate(25.6, 15) scale(0.90)">
    <path d="M 72 96 L 168 96 L 256 364 L 216 428 L 72 96 Z" fill="url(#vLeftGrad)"/>
    <path d="M 440 96 L 344 96 L 256 364 L 296 428 L 440 96 Z" fill="url(#vRightGrad)"/>
    <polygon points="256,120 284,175 256,230 228,175" fill="url(#vCenterGrad)"/>
    <polygon points="256,364 216,428 256,448 296,428" fill="#FFFFFF"/>
  </g>
</svg>
