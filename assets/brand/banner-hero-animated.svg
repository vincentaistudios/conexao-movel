<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo Deep Space -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Gradiente Neon Primario -->
    <linearGradient id="neonBlueViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Gradiente de Destaque Esmeralda / Ciano -->
    <linearGradient id="cyanEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Filtro de Brilho Suave (Glow) -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.04); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes orbitNode {
      0% { transform: rotate(0deg) translateX(45px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(45px) rotate(-360deg); }
    }
    @keyframes badgeFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .ambient-glow {
      transform-origin: center;
      animation: pulseGlow 6s ease-in-out infinite;
    }
    .flow-path {
      stroke-dasharray: 12, 12;
      animation: flowLine 14s linear infinite;
    }
    .badge-card {
      animation: badgeFloat 4s ease-in-out infinite;
    }
    .badge-delayed {
      animation: badgeFloat 4s ease-in-out infinite 2s;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .text-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 0.05em;
    }
    .text-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.08em;
    }
  </style>

  <!-- Fundo do Banner com cantos arredondados -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Efeitos de Luz de Fundo (Ambient Glow Orbs) -->
  <circle cx="240" cy="120" r="140" fill="#38bdf8" opacity="0.12" filter="url(#softGlow)" class="ambient-glow" />
  <circle cx="960" cy="300" r="160" fill="#818cf8" opacity="0.12" filter="url(#softGlow)" class="ambient-glow" />
  <circle cx="600" cy="210" r="110" fill="#c084fc" opacity="0.08" filter="url(#softGlow)" class="ambient-glow" />

  <!-- Malha de Grade Tecnologica Sutil -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.25">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="250" y1="0" x2="250" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="950" y1="0" x2="950" y2="420" />
    <line x1="1100" y1="0" x2="1100" y2="420" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="340" x2="1200" y2="340" />
  </g>

  <!-- Linhas de Transmissao de Dados Conectando Mobile ao PC -->
  <path d="M 160 210 Q 380 90, 600 210 T 1040 210" fill="none" stroke="url(#neonBlueViolet)" stroke-width="2.5" opacity="0.6" class="flow-path" />
  <path d="M 160 210 Q 380 330, 600 210 T 1040 210" fill="none" stroke="#06b6d4" stroke-width="1.8" opacity="0.4" class="flow-path" style="animation-direction: reverse;" />

  <!-- Icone / No Esquerdo: Smartphone Android -->
  <g transform="translate(110, 160)">
    <rect width="100" height="100" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <rect width="90" height="90" x="5" y="5" rx="16" fill="#1e293b" opacity="0.5" />
    <!-- Vetor Smartphone Minimalista -->
    <rect x="36" y="22" width="28" height="56" rx="5" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="46" y1="28" x2="54" y2="28" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <circle cx="50" cy="70" r="2.5" fill="#38bdf8" />
    <text x="50" y="92" text-anchor="middle" fill="#94a3b8" class="text-mono">MOBILE</text>
  </g>

  <!-- Icone / No Direito: Desktop PC (Windows / Linux) -->
  <g transform="translate(990, 160)">
    <rect width="100" height="100" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <rect width="90" height="90" x="5" y="5" rx="16" fill="#1e293b" opacity="0.5" />
    <!-- Vetor Monitor Minimalista -->
    <rect x="30" y="26" width="40" height="30" rx="3" fill="none" stroke="#818cf8" stroke-width="2.5" />
    <line x1="42" y1="62" x2="58" y2="62" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="50" y1="56" x2="50" y2="62" stroke="#818cf8" stroke-width="2.5" />
    <text x="50" y="92" text-anchor="middle" fill="#94a3b8" class="text-mono">DESKTOP</text>
  </g>

  <!-- Bloco Central: Identidade Visual e Titulo -->
  <g transform="translate(600, 105)">
    <!-- Insignia Central com Logo V da Vincent AI Studios -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="38" fill="#0f172a" stroke="url(#neonBlueViolet)" stroke-width="2.5" filter="url(#intenseGlow)" />
      <!-- Poligono Vetorial V -->
      <path d="M -16 -14 L 0 16 L 16 -14 L 8 -14 L 0 4 L -8 -14 Z" fill="url(#neonBlueViolet)" />
    </g>

    <!-- Titulo Principal -->
    <text x="0" y="65" text-anchor="middle" fill="#f8fafc" font-size="44" class="text-title">
      CONEXÃO MÓVEL
    </text>

    <!-- Subtitulo Elegante -->
    <text x="0" y="98" text-anchor="middle" fill="#94a3b8" font-size="15" class="text-subtitle">
      A PONTE DEFINITIVA ENTRE SEU SMARTPHONE ANDROID E SEU COMPUTADOR
    </text>

    <text x="0" y="122" text-anchor="middle" fill="#38bdf8" font-size="12" class="text-mono">
      LOCAL-FIRST • CRIPTOGRAFIA PONTA A PONTA • LATÊNCIA ZERO • ZERO NUVEM
    </text>
  </g>

  <!-- Pílulas de Recursos em Destaque (Badges Visuais Flutuantes) -->
  <g transform="translate(250, 320)" class="badge-card">
    <rect width="150" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="22" cy="21" r="5" fill="#10b981" />
    <text x="36" y="25" fill="#e2e8f0" font-size="11" class="text-mono">STREAM DECK</text>
  </g>

  <g transform="translate(420, 320)" class="badge-delayed">
    <rect width="170" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="22" cy="21" r="5" fill="#ef4444" />
    <text x="36" y="25" fill="#e2e8f0" font-size="11" class="text-mono">SPIKE COMPANION</text>
  </g>

  <g transform="translate(610, 320)" class="badge-card">
    <rect width="150" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="22" cy="21" r="5" fill="#38bdf8" />
    <text x="36" y="25" fill="#e2e8f0" font-size="11" class="text-mono">SNAP LAYOUTS</text>
  </g>

  <g transform="translate(780, 320)" class="badge-delayed">
    <rect width="170" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="22" cy="21" r="5" fill="#818cf8" />
    <text x="36" y="25" fill="#e2e8f0" font-size="11" class="text-mono">AUTO-UPDATE OTA</text>
  </g>

</svg>
